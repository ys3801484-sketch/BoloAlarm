<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas for Play Store Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#38BDF8" fill-opacity="0.08" />

  <!-- Main Clock Assembly with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Top Snooze Handle -->
    <rect x="236" y="132" width="40" height="12" rx="6" fill="#F59E0B" />

    <!-- Twin Alarm Bell Nodes -->
    <path d="M 175 160 C 160 138 175 114 204 128 C 209 133 213 142 213 156 Z" fill="#F59E0B" />
    <path d="M 337 160 C 352 138 337 114 308 128 C 303 133 299 142 299 156 Z" fill="#F59E0B" />

    <!-- Clock Legs -->
    <line x1="180" y1="342" x2="156" y2="375" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" />
    <line x1="332" y1="342" x2="356" y2="375" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" />

    <!-- Outer Bezel -->
    <circle cx="256" cy="256" r="104" fill="url(#bezelGrad)" />

    <!-- Clock Face Dial -->
    <circle cx="256" cy="256" r="97" fill="#F8FAFC" />

    <!-- Hour Markers -->
    <rect x="252" y="171" width="8" height="14" rx="3" fill="#94A3B8" />
    <rect x="332" y="252" width="14" height="8" rx="3" fill="#94A3B8" />
    <rect x="252" y="327" width="8" height="14" rx="3" fill="#94A3B8" />
    <rect x="166" y="252" width="14" height="8" rx="3" fill="#94A3B8" />

    <!-- Minute Hand (12:00) -->
    <line x1="256" y1="256" x2="256" y2="190" stroke="#F59E0B" stroke-width="13" stroke-linecap="round" />

    <!-- Hour Hand (8:00) -->
    <line x1="256" y1="256" x2="208" y2="284" stroke="#0F172A" stroke-width="14" stroke-linecap="round" />

    <!-- Center Pivot Cap -->
    <circle cx="256" cy="256" r="12" fill="#F59E0B" />
    <circle cx="256" cy="256" r="6" fill="#FFFFFF" />

    <!-- Voice Sound Wave Arcs (Representing Bolo / Voice Reminder) -->
    <path d="M 370 222 C 385 240 385 264 370 282" fill="none" stroke="#06B6D4" stroke-width="11" stroke-linecap="round" />
    <path d="M 394 204 C 416 232 416 272 394 300" fill="none" stroke="#06B6D4" stroke-width="11" stroke-linecap="round" />
  </g>
</svg>
